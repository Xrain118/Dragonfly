controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    tilt_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints: [left_joint_1, left_joint_2, left_joint_3, left_joint_4, left_joint_5]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      left_joint_1: {trajectory: 0.25, goal: 0.05}
      left_joint_2: {trajectory: 0.25, goal: 0.05}
      left_joint_3: {trajectory: 0.25, goal: 0.05}
      left_joint_4: {trajectory: 0.25, goal: 0.05}
      left_joint_5: {trajectory: 0.25, goal: 0.05}

right_arm_controller:
  ros__parameters:
    joints: [right_joint_1, right_joint_2, right_joint_3, right_joint_4, right_joint_5]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      right_joint_1: {trajectory: 0.25, goal: 0.05}
      right_joint_2: {trajectory: 0.25, goal: 0.05}
      right_joint_3: {trajectory: 0.25, goal: 0.05}
      right_joint_4: {trajectory: 0.25, goal: 0.05}
      right_joint_5: {trajectory: 0.25, goal: 0.05}

tilt_controller:
  ros__parameters:
    joints: [unit_a_outer_joint, unit_a_inner_joint, unit_b_outer_joint, unit_b_inner_joint, unit_c_outer_joint, unit_c_inner_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      unit_a_outer_joint: {trajectory: 0.15, goal: 0.04}
      unit_a_inner_joint: {trajectory: 0.15, goal: 0.04}
      unit_b_outer_joint: {trajectory: 0.15, goal: 0.04}
      unit_b_inner_joint: {trajectory: 0.15, goal: 0.04}
      unit_c_outer_joint: {trajectory: 0.15, goal: 0.04}
      unit_c_inner_joint: {trajectory: 0.15, goal: 0.04}
